name: Update Ladestation-Status

on:
  schedule:
    - cron: "0 16 * * *"  # 18:00 Europe/Berlin (Sommerzeit), 17:00 im Winter
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Ladestationen (OCPDB)
        run: python3 scripts/fetch_stations.py

      - name: Commit und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update Ladestation-Status $(date -u +%Y-%m-%d)"
          git push
